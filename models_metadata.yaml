models_metadata:
  forex_predictor:
    name: LemGendary Forex Predictor (Multi-Scale CNN-Transformer)
    arch: Multi-Scale CNN-Transformer (Causal TCN + Cross-Timeframe Attention)
    loss: forex_dual
    datasets:
    - LemGendizedForexTitanCoreLarge
    - LemGendizedForexG7MajorsLarge
    - LemGendizedForexHighBetaLarge
    - LemGendizedForexUniverseLarge
    sota_targets:
      dir_acc: 78.7
      win_rate: 68.2
      profit_factor: 2.2
      sharpe_ratio: 2.31
      sortino_ratio: 2.94
      max_drawdown: 9.5
      tp_mae: 3.8
      sl_mae: 3.8
